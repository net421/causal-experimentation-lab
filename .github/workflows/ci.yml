name: causal-experiment-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked toolchain and package
        run: |
          python -m pip install --disable-pip-version-check --requirement requirements-lock.txt
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps -e .
      - name: Run tests and regenerate scientific evidence
        run: make check
      - name: Build fail-closed causal release envelope
        run: |
          mkdir -p "$RUNNER_TEMP/causal-release"
          PYTHONPATH=src python -m causal_lab.release \
            --root . \
            --output "$RUNNER_TEMP/causal-release/causal_release_envelope.json"
      - name: Upload canonical causal evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: causal-experiment-validation-evidence
          path: |
            data/generated/
            reports/generated/
            ${{ runner.temp }}/causal-release/
          if-no-files-found: error
