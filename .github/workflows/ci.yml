name: causal-experiment-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked toolchain and package
        run: |
          python -m pip install --disable-pip-version-check --requirement requirements-lock.txt
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps -e .
      - name: Run tests and regenerate evidence
        run: make check
      - name: Verify generated evidence is committed
        run: |
          git diff --exit-code -- data/generated reports/generated
          test -z "$(git status --porcelain --untracked-files=all -- data/generated reports/generated)"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
