[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-experimentation-lab"
version = "1.0.0"
description = "Reproducible synthetic A/B experiment with covariate adjustment and governed decision gates"
readme = "README.md"
requires-python = "==3.12.13"
license = {text = "MIT"}
authors = [{name = "net421"}]
dependencies = ["numpy==2.3.5"]

[project.scripts]
causal-experiment = "causal_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
